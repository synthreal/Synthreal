[package]
name = "synthreal-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI tool for the Synthreal Agent OS"

[[bin]]
name = "synthreal"
path = "src/main.rs"

[dependencies]
synthreal-types = { path = "../synthreal-types" }
synthreal-kernel = { path = "../synthreal-kernel" }
synthreal-api = { path = "../synthreal-api" }
synthreal-migrate = { path = "../synthreal-migrate" }
synthreal-skills = { path = "../synthreal-skills" }
synthreal-extensions = { path = "../synthreal-extensions" }
zeroize = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
clap_complete = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true, features = ["blocking"] }
synthreal-runtime = { path = "../synthreal-runtime" }
uuid = { workspace = true }
ratatui = { workspace = true }
colored = { workspace = true }
tempfile = { workspace = true }
